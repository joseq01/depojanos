<script type="module">
  // Importa Firebase SDK (asegúrate de que tu proyecto lo permite si no usás bundlers como Webpack)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  setDoc,
  addDoc,
  updateDoc,
  query,
  where,
  orderBy,
  Timestamp,
  deleteDoc,
  doc,
  increment
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyBS2yswfrDzyOzlP2aJRkws8sX8930DvYY",
    authDomain: "stock-janos.firebaseapp.com",
    projectId: "stock-janos",
    storageBucket: "stock-janos.firebasestorage.app",
    messagingSenderId: "656905318444",
    appId: "1:656905318444:web:90fd9780bb9f3c424ba189",
    measurementId: "G-DGXEE6YHFX"
  };

  // Inicializar Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function cargarSalonesEnDatalistIngreso() {
  const datalist = document.getElementById("listaSalonesIngreso");
  datalist.innerHTML = "";

  try {
    const snapshot = await getDocs(collection(db, "salones"));
    snapshot.forEach(doc => {
      const data = doc.data();
      if (data.nombre) {
        const opcion = document.createElement("option");
        opcion.value = data.nombre;
        datalist.appendChild(opcion);
      }
    });
  } catch (error) {
    console.error("Error cargando salones para ingreso:", error);
  }
}

// Llamar al cargar la planilla de ingreso
cargarSalonesEnDatalistIngreso();

  let combos = {}; // fuera de cualquier función, arriba del todo

  async function cargarCombosDesdeFirestore() {
  // Intentamos cargar desde sessionStorage
  const combosCache = sessionStorage.getItem("combosCache");
  if (combosCache) {
    combos = JSON.parse(combosCache);
    console.log("✅ Combos cargados desde cache");
    return;
  }

  // Si no hay cache, consultamos Firestore
  const combosRef = collection(db, "stock-combos");
  const snapshot = await getDocs(combosRef);
  combos = {};

  snapshot.forEach((doc) => {
    const nombreCombo = doc.id;
    const data = doc.data();

    if (Array.isArray(data.productos)) {
      combos[nombreCombo] = data.productos.map(item => ({
        articulo: item.articulo || "",
        unidades: item.unidades ?? 0,
        "caja-pack": item.cajas ?? 0,
        nota: item.nota || ""
      }));
    } else {
      combos[nombreCombo] = [];
    }
  });

  // Guardamos en sessionStorage
  sessionStorage.setItem("combosCache", JSON.stringify(combos));
  console.log("📦 Combos guardados en cache");
}
async function abrirModalCombos() {
  await cargarCombosDesdeFirestore();
  mostrarFlotante();
}
document.addEventListener("DOMContentLoaded", () => {
  const boton = document.getElementById("botonAgregarCombos");
  if (boton) {
    boton.addEventListener("click", abrirModalCombos);
  } else {
    console.error("❌ No se encontró el botón #botonAgregarCombos");
  }
});


function mostrarFlotante() {
  const contenedor = document.getElementById("contenedorCombos");
  if (!contenedor) {
    console.error("No se encontró el contenedor de combos.");
    return;
  }

  // Leer combosCache desde sessionStorage
  let combosCache = {};
  const cacheStr = sessionStorage.getItem("combosCache");
  if (cacheStr) {
    try {
      combosCache = JSON.parse(cacheStr);
    } catch (e) {
      console.error("Error al parsear combosCache:", e);
    }
  }

  contenedor.innerHTML = "";

  // 🔍 Crear campo de búsqueda con lupa
  const buscadorWrapper = document.createElement("div");
  buscadorWrapper.className = "input-group mb-3 position-relative";

  const inputBusqueda = document.createElement("input");
  inputBusqueda.type = "text";
  inputBusqueda.className = "form-control";
  inputBusqueda.placeholder = "Buscar combo...";

  const spanIcono = document.createElement("span");
  spanIcono.className = "input-group-text";
  spanIcono.innerHTML = "🔍";

  buscadorWrapper.appendChild(inputBusqueda);
  buscadorWrapper.appendChild(spanIcono);
  contenedor.appendChild(buscadorWrapper);

  // 🧠 Autocompletado
  function cerrarListas() {
    const lista = document.getElementById("lista-autocompletar");
    if (lista) lista.remove();
  }

  inputBusqueda.addEventListener("input", function () {
    const val = this.value.toLowerCase();
    const sugerencias = Object.keys(combosCache).filter((nombre) =>
      nombre.toLowerCase().includes(val)
    );

    cerrarListas();
    if (!val) return;

    const lista = document.createElement("div");
    lista.setAttribute("id", "lista-autocompletar");
    lista.className = "list-group position-absolute w-100 zindex-dropdown";
    this.parentNode.appendChild(lista);

    sugerencias.forEach((nombre) => {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "list-group-item list-group-item-action";
      item.textContent = nombre;

      item.addEventListener("click", function () {
        inputBusqueda.value = nombre;
        cerrarListas();

        const idCard = `combo-${nombre.replace(/\s+/g, "-")}`;
        const card = document.getElementById(idCard);

        if (card) {
          const checkbox = card.querySelector(`input[type="checkbox"]`);
          if (checkbox) checkbox.checked = true;

          card.scrollIntoView({ behavior: "smooth", block: "start" });
          card.classList.add("border", "border-warning");
          setTimeout(() => card.classList.remove("border", "border-warning"), 2000);
        }
      });

      lista.appendChild(item);
    });
  });

  document.addEventListener("click", (e) => {
    if (!contenedor.contains(e.target)) cerrarListas();
  });

  // 🧺 Crear cards de combos (usando `combos`)
  Object.entries(combos).forEach(([nombre, productos]) => {
    const card = document.createElement("div");
    card.className = "combo-card";
    card.id = `combo-${nombre.replace(/\s+/g, "-")}`;

async function actualizarStockTotal(articulo, unidades, cajas, origen) {
  const existe = await existeArticuloEnStockArticulos(articulo);

  if (!existe) {
    console.warn(`⚠️ El artículo "${articulo}" no existe en stock-articulos. No se actualiza stock-total.`);
    return true; // ✅ Permitir ingreso sin validar stock para artículos inexistentes
  }

  const stockTotalRef = doc(db, "stock-total", articulo);
  const stockSnap = await getDoc(stockTotalRef);
  const data = stockSnap.exists() ? stockSnap.data() : null;

  const stockSalon = data?.salones?.[origen] || { unidades: 0, cajas: 0 };
  const unidadesActuales = parseInt(stockSalon.unidades) || 0;
  const cajasActuales = parseInt(stockSalon.cajas) || 0;

  const nuevasUnidades = unidadesActuales + unidades;
  const nuevasCajas = cajasActuales + cajas;

  if (nuevasUnidades < 0 || nuevasCajas < 0) {
    await Swal.fire({
      icon: "error",
      title: "Stock insuficiente",
      text: `No se puede modificar el stock de "${articulo}" en "${origen}" porque no hay suficiente:\n` +
            `Stock actual: ${unidadesActuales} unidades / ${cajasActuales} cajas\n` +
            `Intentás modificar: ${unidades} unidades / ${cajas} cajas.`
    });
    return false;
  }

  if (stockSnap.exists()) {
    await updateDoc(stockTotalRef, {
      [`salones.${origen}.unidades`]: nuevasUnidades,
      [`salones.${origen}.cajas`]: nuevasCajas,
      "caja-pack": (data["caja-pack"] || 0) + cajas
    });
  } else {
    await setDoc(stockTotalRef, {
      articulo,
      "caja-pack": cajas,
      salones: {
        [origen]: {
          unidades,
          cajas
        }
      }
    });
  }

  return true;
}

async function cargarArticulosDesdeFirestore() {

async function existeArticuloEnStockArticulos(nombreArticulo) {

}

async function agregarArticulo() {
  const articulo = document.getElementById("articulo").value.trim();
  const unidades = parseInt(document.getElementById("unidades").value) || 0;
  const cajas = parseInt(document.getElementById("cajas").value) || 0;
  const rotas = parseInt(document.getElementById("rotas").value) || 0; // Unidades Rotas
  const notas = document.getElementById("notas").value.trim();
  const ingreso = document.getElementById("salonIngreso").value;
  const origen = document.getElementById("salonDestino").textContent;
  const fecha = Timestamp.fromDate(new Date());
  const usuario = sessionStorage.getItem("usuario");
  const salonEnviar = document.getElementById("salonEnviar").value.trim();

  if (articulo === "") return;

  // ⚠️ Primero verificar y actualizar stock antes de guardar
  const actualizado = await actualizarStockTotal(articulo, unidades, cajas, origen);
  if (!actualizado) return; // ❌ Detener el flujo si hay stock insuficiente

  // ✅ Ahora sí, guardar en "stock-ingreso"
  const docRef = await addDoc(collection(db, "stock-ingreso"), {
    articulo,
    unidades,
    cajas,
    rotas,
    notas,
    salones: ingreso,
    origen,
    usuario,
    fecha
  });

  const fechaFormateada = fecha.toDate().toLocaleDateString('es-AR', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric'
  });

  const fila = crearFila(ingreso, fechaFormateada, articulo, unidades, cajas, rotas, notas, usuario, docRef.id);
  document.getElementById("tablaArticulos").insertAdjacentHTML("beforeend", fila);

  mostrarMensajeGuardado();

  // ✅ Guardar en bandeja
  guardarEnBandeja({ articulo, unidades, cajas, salon: salonEnviar, notas });

  // ✅ Cargar últimos pedidos
  await cargarTablaPedidos(true);

  // Limpiar inputs
  document.getElementById("articulo").value = "";
  document.getElementById("unidades").value = "";
  document.getElementById("cajas").value = "";
  document.getElementById("notas").value = "";
  document.getElementById("salonIngreso").value = "";
  document.getElementById("rotas").value = "";
}

async function cargarTablaPedidos(soloUltimosDias = true) {
  const tabla = document.getElementById("tablaArticulos");
  tabla.innerHTML = "";

  const salonSeleccionado = sessionStorage.getItem("salon");
  if (!salonSeleccionado) {
    console.warn("No hay salón seleccionado");
    return;
  }

  const pedidosRef = collection(db, "stock-ingreso");

  let q;
  if (soloUltimosDias) {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const haceDosDias = new Date(hoy);
    haceDosDias.setDate(hoy.getDate() - 4); // Incluye hoy y 4 días atrás

    const timestampDesde = Timestamp.fromDate(haceDosDias);

    q = query(
      pedidosRef,
      where("origen", "==", salonSeleccionado),
      where("fecha", ">=", timestampDesde),
      orderBy("fecha")
    );
  } else {
    q = query(
      pedidosRef,
      where("origen", "==", salonSeleccionado),
      orderBy("fecha")
    );
  }

  const snapshot = await getDocs(q);

  snapshot.forEach((docSnap) => {
    const data = docSnap.data();
    const fecha = data.fecha instanceof Timestamp
      ? data.fecha.toDate().toLocaleDateString('es-AR', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        })
      : data.fecha;

   const fila = crearFila(
     data.salones || "", // ← Salón origen correcto
     fecha,              // ← Fecha formateada
     data.articulo || "",
     data.unidades ?? 0,
     data["caja-pack"] ?? data.cajas ?? 0,
     data.rotas ?? 0,
     data.notas || "",
     data.usuario || "",
     docSnap.id
   );

    tabla.insertAdjacentHTML("beforeend", fila);
  });
}
window.cargarTablaPedidos = cargarTablaPedidos;


async function eliminarFila(btn, event) {
  event.stopPropagation();
  const fila = btn.closest("tr");
  const docId = fila.getAttribute("data-id");

  if (!docId) {
    fila.remove();
    return;
  }

  // Confirmar antes de modificar stock o eliminar
  const confirmacion = await Swal.fire({
    title: '¿Eliminar ingreso?',
    text: 'Esta acción no se puede deshacer.',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#d33',
    cancelButtonColor: '#6c757d',
    confirmButtonText: 'Sí, eliminar',
    cancelButtonText: 'Cancelar'
  });

  if (!confirmacion.isConfirmed) return;

  try {
    const docRef = doc(db, "stock-ingreso", docId);
    const docSnap = await getDoc(docRef);

    if (!docSnap.exists()) return;

    const data = docSnap.data();
    const { articulo, unidades, cajas, origen } = data;

    const artSnap = await getDocs(query(collection(db, "stock-articulos"), where("articulo", "==", articulo)));
    if (!artSnap.empty) {
      // Obtener stock actual antes de intentar restar
      const stockRef = doc(db, "stock-total", articulo);
      const stockSnap = await getDoc(stockRef);

      if (stockSnap.exists()) {
        const stockData = stockSnap.data();
        const stockSalon = stockData.salones?.[origen] || { unidades: 0, cajas: 0 };

        // Verificar si hay stock suficiente para "devolver" lo que se eliminaría
        const nuevasUnidades = (stockSalon.unidades || 0) - (parseInt(unidades) || 0);
        const nuevasCajas = (stockSalon.cajas || 0) - (parseInt(cajas) || 0);

        if (nuevasUnidades < 0 || nuevasCajas < 0) {
          await Swal.fire({
            icon: 'error',
            title: 'No se puede eliminar',
            text: `Eliminar dejaría el stock en negativo para "${articulo}" en el salón "${origen}".`,
            confirmButtonColor: '#d33'
          });
          return;
        }
      }
    }

    // ✅ Recién ahora eliminamos y restamos
    if (!artSnap.empty) {
      await restarStockTotal(articulo, parseInt(unidades) || 0, parseInt(cajas) || 0, origen);
    }

    await deleteDoc(docRef);
    fila.remove();
    mostrarMensajeEliminado();

  } catch (error) {
    console.error("Error eliminando documento:", error);
  }
}


async function restarStockTotal(articulo, unidades, cajas, origen) {
  const existe = await existeArticuloEnStockArticulos(articulo);

  if (!existe) {
    console.warn(`⚠️ El artículo "${articulo}" no existe en stock-articulos. No se descuenta stock-total.`);
    return;
  }

  const stockTotalRef = doc(db, "stock-total", articulo);
  const stockSnap = await getDoc(stockTotalRef);

  if (!stockSnap.exists()) {
    console.warn(`⚠️ No se encontró "${articulo}" en stock-total.`);
    return;
  }

  const data = stockSnap.data();
  const stockSalon = (data.salones && data.salones[origen]) || { unidades: 0, cajas: 0 };

  const unidadesActuales = parseInt(stockSalon.unidades) || 0;
  const cajasActuales = parseInt(stockSalon.cajas) || 0;

  const nuevasUnidades = unidadesActuales - unidades;
  const nuevasCajas = cajasActuales - cajas;

  if (nuevasUnidades < 0 || nuevasCajas < 0) {
    console.warn(`❌ No se puede restar "${articulo}" en salón "${origen}": stock insuficiente.`);
    return;
  }

  // Descontar stock (ya validado)
  await updateDoc(stockTotalRef, {
    "caja-pack": increment(-cajas),
    [`salones.${origen}.unidades`]: nuevasUnidades,
    [`salones.${origen}.cajas`]: nuevasCajas
  });
}

window.guardarCambiosFilaSeleccionada = async function () {
  const filaSeleccionada = document.querySelector("tr.bg-warning");
  if (!filaSeleccionada) return;

  const id = filaSeleccionada.dataset.id;
  if (!id) return;

  const celdas = filaSeleccionada.children;
  const articulo = celdas[3].textContent.trim();
  const nuevasUnidades = parseInt(celdas[4].textContent.trim()) || 0;
  const nuevasCajas = parseInt(celdas[5].textContent.trim()) || 0;
  const nuevasRotas = parseInt(celdas[6].textContent.trim()) || 0;
  const nuevasNotas = celdas[7].textContent.trim();
  const fechaFila = celdas[2].textContent.trim();

  // Validar fecha igual a hoy
  const [diaF, mesF, anioF] = fechaFila.split("/");
  const fechaFilaNormalizada = `${diaF.padStart(2, "0")}/${mesF.padStart(2, "0")}/${anioF}`;
  const hoy = new Date();
  const fechaHoy = `${String(hoy.getDate()).padStart(2, "0")}/${String(hoy.getMonth() + 1).padStart(2, "0")}/${hoy.getFullYear()}`;

  if (fechaFilaNormalizada !== fechaHoy) {
    await Swal.fire({
      icon: 'warning',
      title: 'Edición no permitida',
      text: `Solo se pueden modificar ingresos del día de hoy (${fechaHoy}).`,
      confirmButtonColor: '#3085d6'
    });
    return;
  }

  const origen = sessionStorage.getItem("salon");
  const usuarioLogueado = sessionStorage.getItem("usuario");

  // Consultar si el artículo existe
  const artSnap = await getDocs(query(collection(db, "stock-articulos"), where("articulo", "==", articulo)));
  const articuloExiste = !artSnap.empty;

  if (articuloExiste) {
    const ingresoDoc = await getDoc(doc(db, "stock-ingreso", id));
    if (!ingresoDoc.exists()) return;

    const ingresoAnterior = ingresoDoc.data();
    const prevUnidades = ingresoAnterior.unidades || 0;
    const prevCajas = ingresoAnterior.cajas ?? ingresoAnterior["caja-pack"] ?? 0;

    const diferenciaUnidades = nuevasUnidades - prevUnidades;
    const diferenciaCajas = nuevasCajas - prevCajas;

    if (diferenciaUnidades !== 0 || diferenciaCajas !== 0) {
      await sumarStockTotal(articulo, diferenciaUnidades, diferenciaCajas, origen);
    }
  }

  // Actualizar Firestore con todos los campos modificables + usuario
  const updateData = {
    unidades: nuevasUnidades,
    cajas: nuevasCajas,
    rotas: nuevasRotas,
    notas: nuevasNotas,
    usuario: usuarioLogueado  // ✅ Siempre se actualiza
  };

  await updateDoc(doc(db, "stock-ingreso", id), updateData);

  // ✅ Actualizar visualmente las celdas
  celdas[4].textContent = nuevasUnidades;
  celdas[5].textContent = nuevasCajas;
  celdas[6].textContent = nuevasRotas;
  celdas[7].textContent = nuevasNotas;
  celdas[9].textContent = usuarioLogueado;  // ✅ Refrescar usuario

  if (typeof actualizarBandejaVisual === "function") {
    actualizarBandejaVisual();
  }

  filaSeleccionada.classList.remove("bg-warning");
  document.getElementById("btnGuardarCambios")?.classList.add("d-none");

  Swal.fire({
    icon: "success",
    title: "Cambios guardados",
    timer: 1000,
    showConfirmButton: false
  });
};

window.eliminarDeBandeja = async function (index) {
  const item = bandejaArticulos[index];
  const salonActual = sessionStorage.getItem("salon");

  const result = await Swal.fire({
    title: '¿Eliminar artículo?',
    html: `<strong>${item.articulo}</strong><br>
           ${item.unidades ? `Unid: ${item.unidades}` : ''} 
           ${item.cajas ? `Cajas: ${item.cajas}` : ''} 
           ${item.salonenviar ? `<br>Destino: ${item.salonenviar}` : ''} 
           ${item.notas ? `<br><em>📝 ${item.notas}</em>` : ''}`,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Sí, eliminar',
    cancelButtonText: 'Cancelar',
    confirmButtonColor: '#d33',
    cancelButtonColor: '#aaa'
  });

  if (result.isConfirmed) {
    try {
      const id = item?.id;
      if (id) {
        await deleteDoc(doc(db, "bandeja", salonActual, "items", id));
      }
      bandejaArticulos.splice(index, 1);
      actualizarBandejaVisual();
      verificarBandeja();

      Swal.fire({
        icon: 'success',
        title: 'Eliminado',
        text: 'El artículo fue eliminado de la bandeja.',
        timer: 1500,
        showConfirmButton: false
      });

    } catch (e) {
      console.error("Error al eliminar de bandeja:", e);
      Swal.fire('Error', 'No se pudo eliminar el artículo.', 'error');
    }
  }
};


// ✅ Primero definís la función
async function cargarBandejaDesdeFirestore() {
  const salonActual = sessionStorage.getItem("salon");
  if (!salonActual) return;

  const snapshot = await getDocs(collection(db, "bandeja", salonActual, "items"));
  bandejaArticulos = [];

  snapshot.forEach(doc => {
    const data = doc.data();
    bandejaArticulos.push({
      id: doc.id,
      articulo: data.articulo,
      unidades: data.unidades,
      cajas: data.cajas,
      salonenviar: data.salonenviar, // ← mostrás esto en la UI
      notas: data.notas
    });
  });

  actualizarBandejaVisual();
  verificarBandeja();
}



// ✅ Luego hacés que se ejecute cuando la página cargue
document.addEventListener("DOMContentLoaded", () => {
  cargarBandejaDesdeFirestore();
});

//fin bandeja
