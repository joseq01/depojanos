/* Estados base */
#formularioIngreso.oculto { display: none; }
#formularioIngreso.visible,
#formularioIngreso.desgranando {
  display: block;
  overflow: hidden;       /* necesario para que el recorte sea limpio */
  will-change: clip-path, transform, opacity;
}

/* Mostrar: revelado en bloques (de abajo hacia arriba) */
#formularioIngreso.visible {
  animation: revealBlocks 420ms steps(6) forwards;
}

/* Ocultar: “desgranando” hacia arriba en bloques */
#formularioIngreso.desgranando {
  animation: crumbleUp 500ms steps(6) forwards;
}

/* Ajustá la cantidad de bloques cambiando steps(6) por steps(8), steps(10), etc. */

/* Keyframes */
@keyframes revealBlocks {
  /* arranca recortado y subiendo un poco */
  from {
    opacity: 0;
    transform: translateY(-20px);
    clip-path: inset(100% 0 0 0); /* todo recortado desde arriba */
  }
  to {
    opacity: 1;
    transform: translateY(0);
    clip-path: inset(0 0 0 0);    /* sin recorte */
  }
}

@keyframes crumbleUp {
  /* se va recortando desde arriba en saltos (bloques) y sube un toque */
  from {
    opacity: 1;
    transform: translateY(0);
    clip-path: inset(0 0 0 0);
  }
  to {
    opacity: 0;
    transform: translateY(-24px);
    clip-path: inset(100% 0 0 0);
  }
}

/* =========================================================
   FORMULARIO INGRESOS - FONDO STOCK-JQ
   ========================================================= */

#formularioIngreso {
  position: relative;
  overflow: hidden;

  padding: 10px 12px 14px 12px;
  border-radius: 12px;

  /* Negro petróleo, combinado con el navbar */
  background: #17262a;

  border: 1px solid rgba(255,255,255,0.12);

  box-shadow:
    0 4px 15px rgba(0,0,0,0.35);
}


/* =========================================================
   STOCK-JQ - MARCA DE AGUA GRANDE
   ========================================================= */

#formularioIngreso::before {
  content: "STOCK-JQ";

  position: absolute;

  /* Grande */
  font-size: clamp(150px, 21vw, 320px);

  font-family: Arial, Helvetica, sans-serif;
  font-weight: 900;

  letter-spacing: 10px;

  /* Inclinación tipo graffiti */
  transform: rotate(-12deg);

  top: 5px;
  left: -100px;

  /* Muy sutil */
  color: rgba(255,255,255,0.065);

  text-shadow:
    8px 8px 0 rgba(255,255,255,0.025),
    -5px -5px 0 rgba(0,0,0,0.05);

  /* Cortes diagonales */
  clip-path: polygon(
    0 8%,
    100% 0,
    94% 18%,
    100% 30%,
    92% 42%,
    100% 55%,
    91% 68%,
    100% 82%,
    92% 100%,
    0 92%,
    7% 78%,
    0 65%,
    8% 52%,
    0 39%,
    7% 25%
  );

  pointer-events: none;
  z-index: 0;
}


/* =========================================================
   CONTENIDO POR ENCIMA DEL STOCK-JQ
   ========================================================= */

#formularioIngreso > * {
  position: relative;
  z-index: 2;
}


/* =========================================================

async function actualizarStockTotal(articulo, unidades, cajas, origen) {
  const existe = await existeArticuloEnStockArticulos(articulo);

  if (!existe) {
    console.warn(`⚠️ El artículo "${articulo}" no existe en stock-articulos.`);
    return true;
  }

  const stockTotalRef = doc(db, "stock-total", articulo);
  const stockSnap = await getDoc(stockTotalRef);
  const data = stockSnap.exists() ? stockSnap.data() : null;

  const stockSalon = data?.salones?.[origen] || { unidades: 0, cajas: 0 };

  let unidadesActuales = parseInt(stockSalon.unidades) || 0;
  let cajasActuales = parseInt(stockSalon.cajas) || 0;

  let nuevasUnidades = unidadesActuales + unidades;
  let nuevasCajas = cajasActuales + cajas;

  // ✅ 1. OBTENER unidadesPorCaja PRIMERO
  const articuloData = articulosCache.find(
    a => a.articulo === articulo.trim().toLowerCase()
  );

  const unidadesPorCaja = articuloData
    ? parseInt(articuloData.unixcajapack) || 0
    : 0;

  // 🔥 2. SI FALTAN UNIDADES → CONVERTIR CAJAS
  if (unidadesPorCaja > 0 && nuevasUnidades < 0 && nuevasCajas > 0) {
    const faltantes = Math.abs(nuevasUnidades);
    const cajasNecesarias = Math.ceil(faltantes / unidadesPorCaja);
    const cajasAConvertir = Math.min(cajasNecesarias, nuevasCajas);

    nuevasUnidades += cajasAConvertir * unidadesPorCaja;
    nuevasCajas -= cajasAConvertir;
  }

  // 🔥 3. NORMALIZAR (UNIDADES → CAJAS)
  if (unidadesPorCaja > 0 && nuevasUnidades >= unidadesPorCaja) {
    const cajasFormadas = Math.floor(nuevasUnidades / unidadesPorCaja);

    nuevasUnidades -= cajasFormadas * unidadesPorCaja;
    nuevasCajas += cajasFormadas;
  }

  // 🔴 VALIDACIÓN FINAL
  if (nuevasUnidades < 0 || nuevasCajas < 0) {
    await Swal.fire({
      icon: "error",
      title: "Stock insuficiente",
      text: `Stock actual: ${unidadesActuales} unidades / ${cajasActuales} cajas`
    });
    return false;
  }

  // ✅ GUARDAR
  if (stockSnap.exists()) {
    await updateDoc(stockTotalRef, {
      [`salones.${origen}.unidades`]: nuevasUnidades,
      [`salones.${origen}.cajas`]: nuevasCajas,
      "caja-pack": (data["caja-pack"] || 0) + cajas
    });
  } else {
    await setDoc(stockTotalRef, {
      articulo,
      "caja-pack": cajas,
      salones: {
        [origen]: {
          unidades: nuevasUnidades,
          cajas: nuevasCajas
        }
      }
    });
  }

  return true;
}

// 🔹 Detección automática de escaneo con pistola en el input "articulo"

// LECTOR DE CÓDIGO DE BARRAS
// ==========================================

const inputArticulo = document.getElementById("articulo");

let ultimaEntradaBarcode = 0;
let bufferBarcode = "";
let cantidadEntradasRapidas = 0;
let timerBarcode = null;

inputArticulo.addEventListener("input", (e) => {

  const ahora = Date.now();

  const intervalo = ahora - ultimaEntradaBarcode;

  // ==========================================
  // DETECTAR VELOCIDAD
  // ==========================================

  if (intervalo > 0 && intervalo < 35) {

    // Entrada muy rápida → probable lector
    cantidadEntradasRapidas++;

  } else {

    // Escritura normal → empezar de nuevo
    cantidadEntradasRapidas = 1;
    bufferBarcode = "";
  }

  ultimaEntradaBarcode = ahora;

  // ==========================================
  // TOMAR EL VALOR ACTUAL DEL INPUT
  // ==========================================

  bufferBarcode = inputArticulo.value;

  // ==========================================
  // CANCELAR TEMPORIZADOR ANTERIOR
  // ==========================================

  clearTimeout(timerBarcode);

  // ==========================================
  // ESPERAR A QUE TERMINE LA ENTRADA
  // ==========================================

  timerBarcode = setTimeout(async () => {

    const tiempoDesdeUltimaEntrada =
      Date.now() - ultimaEntradaBarcode;

    // Todavía está entrando información
    if (tiempoDesdeUltimaEntrada < 300) {
      return;
    }

    // ==========================================
    // CONFIRMAR QUE REALMENTE FUE MUY RÁPIDO
    // ==========================================

    if (
      cantidadEntradasRapidas >= 5 &&
      bufferBarcode.trim().length > 4
    ) {

      const barcode = bufferBarcode
        .replace(/[\r\n]+/g, "")
        .trim();

      if (barcode) {

        console.log(
          "📦 Código detectado por velocidad:",
          barcode
        );

        await buscarArticuloPorId(barcode);
      }
    }

    // ==========================================
    // REINICIAR DETECTOR
    // ==========================================

    bufferBarcode = "";
    cantidadEntradasRapidas = 0;

  }, 350);
});

    console.error("Error buscando artículo:", barcode, error);
  }
}

// 🔊 Sonido correcto tipo “bip” de lector
function reproducirBipCorrecto() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.type = "square";
  oscillator.frequency.setValueAtTime(880, ctx.currentTime); // tono agudo
  gain.gain.setValueAtTime(0.1, ctx.currentTime);

  oscillator.connect(gain);
  gain.connect(ctx.destination);
  oscillator.start();
  oscillator.stop(ctx.currentTime + 0.15); // duración 150 ms
}

// ❌ Sonido de error más grave
function reproducirBipError() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.type = "sawtooth";
  oscillator.frequency.setValueAtTime(220, ctx.currentTime); // tono grave
  gain.gain.setValueAtTime(0.1, ctx.currentTime);

  oscillator.connect(gain);
  gain.connect(ctx.destination);
  oscillator.start();
  oscillator.stop(ctx.currentTime + 0.3); // duración 300 ms
}

async function cargarTablaPedidos(filtro = true) {

  const tabla = document.getElementById("tablaArticulos");
  tabla.innerHTML = "";

  const salonSeleccionado = sessionStorage.getItem("salon");

  if (!salonSeleccionado) {
    console.warn("No hay salón seleccionado");
    return;
  }

  const pedidosRef = collection(db, "stock-ingreso");

  let snapshots = [];

  // =====================================================
  // 1. ÚLTIMOS DÍAS
  // =====================================================

  if (filtro === true) {

    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);

    const haceDosDias = new Date(hoy);
    haceDosDias.setDate(hoy.getDate() - 4);

    const timestampDesde =
      Timestamp.fromDate(haceDosDias);

    const q = query(
      pedidosRef,
      where("origen", "==", salonSeleccionado),
      where("fecha", ">=", timestampDesde),
      orderBy("fecha")
    );

    snapshots.push(
      await getDocs(q)
    );
  }


  // =====================================================
  // 2. VER TODOS
  // =====================================================

  else if (filtro === false || filtro === "todos") {

    const q = query(
      pedidosRef,
      where("origen", "==", salonSeleccionado),
      orderBy("fecha")
    );

    snapshots.push(
      await getDocs(q)
    );
  }


  // =====================================================
  // 3. FILTRO POR AÑO
  //    Ejemplo: anio:2026
  // =====================================================

  else if (
    typeof filtro === "string" &&
    filtro.startsWith("anio:")
  ) {

    const anio =
      Number(filtro.replace("anio:", ""));

    const inicio =
      new Date(anio, 0, 1, 0, 0, 0, 0);

    const fin =
      new Date(anio + 1, 0, 1, 0, 0, 0, 0);

    const q = query(
      pedidosRef,
      where("origen", "==", salonSeleccionado),
      where(
        "fecha",
        ">=",
        Timestamp.fromDate(inicio)
      ),
      where(
        "fecha",
        "<",
        Timestamp.fromDate(fin)
      ),
      orderBy("fecha")
    );

    snapshots.push(
      await getDocs(q)
    );
  }


  // =====================================================
  // 4. FILTRO POR MES
  //    Ejemplo: mes:2026-08
  // =====================================================

  else if (
    typeof filtro === "string" &&
    filtro.startsWith("mes:")
  ) {

    const valor =
      filtro.replace("mes:", "");

    const partes =
      valor.split("-");

    const anio =
      Number(partes[0]);

    const mes =
      Number(partes[1]);

    const inicio =
      new Date(
        anio,
        mes - 1,
        1,
        0,
        0,
        0,
        0
      );

    const fin =
      new Date(
        anio,
        mes,
        1,
        0,
        0,
        0,
        0
      );

    const q = query(
      pedidosRef,
      where("origen", "==", salonSeleccionado),
      where(
        "fecha",
        ">=",
        Timestamp.fromDate(inicio)
      ),
      where(
        "fecha",
        "<",
        Timestamp.fromDate(fin)
      ),
      orderBy("fecha")
    );

    snapshots.push(
      await getDocs(q)
    );
  }


  // =====================================================
  // 5. UNA FECHA
  //    Ejemplo: fecha:28/08/2026
  // =====================================================

  else if (
    typeof filtro === "string" &&
    filtro.startsWith("fecha:")
  ) {

    const fechaTexto =
      filtro.replace("fecha:", "");

    const partes =
      fechaTexto.split("/");

    const dia =
      Number(partes[0]);

    const mes =
      Number(partes[1]);

    const anio =
      Number(partes[2]);

    const inicio =
      new Date(
        anio,
        mes - 1,
        dia,
        0,
        0,
        0,
        0
      );

    const fin =
      new Date(
        anio,
        mes - 1,
        dia + 1,
        0,
        0,
        0,
        0
      );

    const q = query(
      pedidosRef,
      where("origen", "==", salonSeleccionado),
      where(
        "fecha",
        ">=",
        Timestamp.fromDate(inicio)
      ),
      where(
        "fecha",
        "<",
        Timestamp.fromDate(fin)
      ),
      orderBy("fecha")
    );

    snapshots.push(
      await getDocs(q)
    );
  }


  // =====================================================
  // 6. VARIOS DÍAS
  //
  // Ejemplo:
  // [
  //   "fecha:05/08/2026",
  //   "fecha:12/08/2026",
  //   "fecha:18/08/2026"
  // ]
  // =====================================================

  else if (Array.isArray(filtro)) {

    const fechas =
      filtro.filter(valor =>
        typeof valor === "string" &&
        valor.startsWith("fecha:")
      );

    const consultas =
      fechas.map(valor => {

        const fechaTexto =
          valor.replace("fecha:", "");

        const partes =
          fechaTexto.split("/");

        const dia =
          Number(partes[0]);

        const mes =
          Number(partes[1]);

        const anio =
          Number(partes[2]);

        const inicio =
          new Date(
            anio,
            mes - 1,
            dia,
            0,
            0,
            0,
            0
          );

        const fin =
          new Date(
            anio,
            mes - 1,
            dia + 1,
            0,
            0,
            0,
            0
          );

        const q = query(
          pedidosRef,
          where(
            "origen",
            "==",
            salonSeleccionado
          ),
          where(
            "fecha",
            ">=",
            Timestamp.fromDate(inicio)
          ),
          where(
            "fecha",
            "<",
            Timestamp.fromDate(fin)
          ),
          orderBy("fecha")
        );

        return getDocs(q);
      });

    snapshots =
      await Promise.all(consultas);
  }


  // =====================================================
  // 7. FILTRO NO RECONOCIDO
  // =====================================================

  else {

    console.warn(
      "Filtro de fecha no reconocido:",
      filtro
    );

    return;
  }


  // =====================================================
  // ARMAR TABLA
  // =====================================================

  const documentos =
    new Map();

  snapshots.forEach(snapshot => {

    snapshot.forEach(docSnap => {

      // Evita duplicados si alguna consulta
      // llegara a coincidir.
      documentos.set(
        docSnap.id,
        docSnap
      );

    });

  });


  // =====================================================
  // ORDENAR POR FECHA
  // =====================================================

  const documentosOrdenados =
    Array.from(
      documentos.values()
    ).sort((a, b) => {

      const fechaA =
        a.data().fecha instanceof Timestamp
          ? a.data().fecha.toMillis()
          : 0;

      const fechaB =
        b.data().fecha instanceof Timestamp
          ? b.data().fecha.toMillis()
          : 0;

      return fechaA - fechaB;
    });


  // =====================================================
  // CREAR FILAS
  // =====================================================

  documentosOrdenados.forEach(docSnap => {

    const data =
      docSnap.data();

    const fecha =
      data.fecha instanceof Timestamp
        ? data.fecha.toDate().toLocaleDateString(
            "es-AR",
            {
              day: "2-digit",
              month: "2-digit",
              year: "numeric"
            }
          )
        : data.fecha;


    const fila =
      crearFila(
        data.salones || "",
        fecha,
        data.articulo || "",
        data.unidades ?? 0,
        data["caja-pack"] ??
          data.cajas ??
          0,
        data.rotas ?? 0,
        data.notas || "",
        data.usuario || "",
        docSnap.id
      );


    tabla.insertAdjacentHTML(
      "beforeend",
      fila
    );

  });
}

async function eliminarFila(btn, event) {
  event.stopPropagation();

  const fila = btn.closest("tr");
  const docId = fila.getAttribute("data-id");

  if (!docId) {
    fila.remove();
    return;
  }

  try {
    const docRef = doc(db, "stock-ingreso", docId);
    const docSnap = await getDoc(docRef);

    if (!docSnap.exists()) return;

    const data = docSnap.data();
    const { articulo, unidades, cajas, origen, salones } = data;

    // Confirmar antes de modificar stock o eliminar
    const confirmacion = await Swal.fire({
      title: '¿Eliminar ingreso?',
      html: `
        <div style="text-align: left;">
          <strong>Artículo:</strong> ${articulo || "-"}<br>
          <strong>Unidades:</strong> ${unidades || 0}<br>
          <strong>Cajas:</strong> ${cajas || 0}<br>
          <strong>Origen:</strong> ${salones || "-"}
        </div>
        <br>
        <span>Esta acción no se puede deshacer.</span>
      `,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#6c757d',
      confirmButtonText: 'Sí, eliminar',
      cancelButtonText: 'Cancelar'
    });

    if (!confirmacion.isConfirmed) return;

    const artSnap = await getDocs(
      query(
        collection(db, "stock-articulos"),
        where("articulo", "==", articulo)
      )
    );

    if (!artSnap.empty) {

      // Obtener stock actual antes de intentar restar
      const stockRef = doc(db, "stock-total", articulo);
      const stockSnap = await getDoc(stockRef);

      if (stockSnap.exists()) {

        const stockData = stockSnap.data();

        const stockSalon =
          stockData.salones?.[origen] || {
            unidades: 0,
            cajas: 0
          };

        // Verificar si hay stock suficiente para "devolver" lo que se eliminaría
        let unidadesActuales =
          parseInt(stockSalon.unidades) || 0;

        let cajasActuales =
          parseInt(stockSalon.cajas) || 0;

        // 🔹 Traer unidades por caja (USÁ CACHE, no Firestore de nuevo)
        const articuloData = articulosCache.find(
          a => a.articulo === articulo.trim().toLowerCase()
        );

        const unidadesPorCaja = articuloData
          ? parseInt(articuloData.unixcajapack) || 0
          : 0;

        // 🔥 Convertir cajas → unidades si falta
        if (unidadesPorCaja > 0 && unidades > unidadesActuales) {

          const faltantes = unidades - unidadesActuales;

          const cajasNecesarias =
            Math.ceil(faltantes / unidadesPorCaja);

          const cajasAConvertir =
            Math.min(cajasNecesarias, cajasActuales);

          unidadesActuales +=
            cajasAConvertir * unidadesPorCaja;

          cajasActuales -= cajasAConvertir;
        }

        // 🔴 VALIDACIÓN REAL
        if (
          unidades > unidadesActuales ||
          cajas > cajasActuales
        ) {

          await Swal.fire({
            icon: 'error',
            title: 'No se puede eliminar',
            text:
              `Eliminar dejaría el stock en negativo para "${articulo}" ` +
              `en el salón "${origen}".`,
            confirmButtonColor: '#d33'
          });

          return;
        }
      }
    }

    // ✅ Recién ahora eliminamos y restamos
    if (!artSnap.empty) {

      await restarStockTotal(
        articulo,
        parseInt(unidades) || 0,
        parseInt(cajas) || 0,
        origen
      );
    }

    await deleteDoc(docRef);

    fila.remove();

    mostrarMensajeEliminado();

  } catch (error) {
    console.error("Error eliminando documento:", error);
  }
}

async function restarStockTotal(articulo, unidades, cajas, origen) {
  const existe = await existeArticuloEnStockArticulos(articulo);
  if (!existe) return;

  const stockTotalRef = doc(db, "stock-total", articulo);
  const stockSnap = await getDoc(stockTotalRef);
  if (!stockSnap.exists()) return;

  const data = stockSnap.data();
  let stockSalon = data.salones?.[origen] || { unidades: 0, cajas: 0 };

  let unidadesActuales = parseInt(stockSalon.unidades) || 0;
  let cajasActuales = parseInt(stockSalon.cajas) || 0;

  // 🔹 usar CACHE (NO Firestore)
  const articuloData = articulosCache.find(a => a.articulo === articulo.trim().toLowerCase());
  const unidadesPorCaja = articuloData ? parseInt(articuloData.unixcajapack) || 0 : 0;

  // 🔥 1. CONVERTIR CAJAS → UNIDADES SI FALTA
  if (unidadesPorCaja > 0 && unidades > unidadesActuales) {
    const faltantes = unidades - unidadesActuales;
    const cajasNecesarias = Math.ceil(faltantes / unidadesPorCaja);
    const cajasAConvertir = Math.min(cajasNecesarias, cajasActuales);

    unidadesActuales += cajasAConvertir * unidadesPorCaja;
    cajasActuales -= cajasAConvertir;
  }

  // 🔴 VALIDACIÓN
  if (unidades > unidadesActuales || cajas > cajasActuales) {
    console.warn(`❌ Stock insuficiente`);
    return;
  }

  // 🔹 DESCONTAR
  let nuevasUnidades = unidadesActuales - unidades;
  let nuevasCajas = cajasActuales - cajas;

  // 🔥 2. REARMAR CAJAS AUTOMÁTICAMENTE
  if (unidadesPorCaja > 0 && nuevasUnidades >= unidadesPorCaja) {
    const cajasFormadas = Math.floor(nuevasUnidades / unidadesPorCaja);
    nuevasUnidades -= cajasFormadas * unidadesPorCaja;
    nuevasCajas += cajasFormadas;
  }

  // ✅ GUARDAR CORRECTO
  await updateDoc(stockTotalRef, {
    "caja-pack": nuevasCajas,
    [`salones.${origen}.unidades`]: nuevasUnidades,
    [`salones.${origen}.cajas`]: nuevasCajas
  });
}

let guardandoSeleccion = false;

async function guardarSeleccion() {

  // 🚫 Evita doble click
  if (guardandoSeleccion) return;

  guardandoSeleccion = true;

  const boton = document.getElementById("btnGuardarSeleccion");

  if (boton) {
    boton.disabled = true;
    boton.textContent = "Guardando...";
  }

  try {

    const contenedor = document.getElementById("contenedorCombos");
    const comboCards = document.querySelectorAll(".combo-card");

    for (let card of comboCards) {

      const checkbox = card.querySelector(".combo-checkbox");

      if (!checkbox.checked) continue;

      const comboNombre = checkbox.dataset.nombre;
      const rows = card.getElementsByClassName("row");

      for (let row of rows) {

        const articuloInput = row.querySelector(".articulo");
        const unidadesInput = row.querySelector(".unidades");
        const cajasInput = row.querySelector(".cajas");
        const notasInput = row.querySelector(".notas");

        if (articuloInput && unidadesInput && cajasInput && notasInput) {

          const articulo = articuloInput.value.trim();
          const unidades = parseInt(unidadesInput.value) || 0;
          const cajas = parseInt(cajasInput.value) || 0;
          const notas = notasInput.value.trim();
          const rotas = 0;

          // 🚫 No registrar si no hay nada cargado
          if (!articulo || (unidades <= 0 && cajas <= 0 && !notas)) continue;

          const fecha = Timestamp.fromDate(new Date());
          const usuario = sessionStorage.getItem("usuario");
          const ingreso = document.getElementById("salonIngreso").value;
          const origen = document.getElementById("salonDestino").textContent;

          try {

            const actualizado = await actualizarStockTotal(
              articulo,
              unidades,
              cajas,
              origen
            );

            if (!actualizado) return;

            const docRef = await addDoc(collection(db, "stock-ingreso"), {
              combo: comboNombre,
              articulo,
              unidades,
              cajas,
              rotas,
              notas,
              fecha,
              usuario,
              salones: ingreso,
              origen
            });

            const fechaFormateada = fecha.toDate().toLocaleDateString('es-AR', {
              day: '2-digit',
              month: '2-digit',
              year: 'numeric'
            });

            const filaHTML = crearFila(
              ingreso,
              fechaFormateada,
              articulo,
              unidades,
              cajas,
              rotas,
              notas,
              usuario,
              docRef.id
            );

            document
              .getElementById("tablaArticulos")
              .insertAdjacentHTML("beforeend", filaHTML);

            mostrarMensajeGuardado();

          } catch (error) {

            console.error("❌ Error al guardar en Firestore:", error);

          }
        }
      }
    }

    cerrarFlotante();

  } finally {

    // ✅ Libera nuevamente el botón
    guardandoSeleccion = false;

    if (boton) {
      boton.disabled = false;
      boton.textContent = "Guardar";
    }
  }
}

async function sumarStockTotal(articulo, unidades, cajas, origen) {
  const stockTotalRef = doc(db, "stock-total", articulo);
  const stockSnap = await getDoc(stockTotalRef);

  if (!stockSnap.exists()) return;

  const data = stockSnap.data();
  let stockSalon = data.salones?.[origen] || { unidades: 0, cajas: 0 };

  let unidadesActuales = parseInt(stockSalon.unidades) || 0;
  let cajasActuales = parseInt(stockSalon.cajas) || 0;

  let nuevasUnidades = unidadesActuales + unidades;
  let nuevasCajas = cajasActuales + cajas;

  // 🔹 unidades por caja
  const artSnap = await getDocs(query(collection(db, "stock-articulos"), where("articulo", "==", articulo)));
  let unidadesPorCaja = 0;
  if (!artSnap.empty) {
    unidadesPorCaja = parseInt(artSnap.docs[0].data().unixcajapack) || 0;
  }

  // 🔥 NORMALIZAR (UNIDADES → CAJAS)
  if (unidadesPorCaja > 0 && nuevasUnidades >= unidadesPorCaja) {
    const cajasFormadas = Math.floor(nuevasUnidades / unidadesPorCaja);
    nuevasUnidades -= cajasFormadas * unidadesPorCaja;
    nuevasCajas += cajasFormadas;
  }

  await updateDoc(stockTotalRef, {
    "caja-pack": increment(cajas),
    [`salones.${origen}.unidades`]: nuevasUnidades,
    [`salones.${origen}.cajas`]: nuevasCajas
  });
}

async function cargarBandejaDesdeFirestore() {
  const salonActual = sessionStorage.getItem("salon");
  if (!salonActual) return;

  const snapshot = await getDocs(collection(db, "bandeja", salonActual, "items"));

  // ✅ Si no hay artículos en Firestore para este salón
  if (snapshot.empty) {
    console.log(`La bandeja está vacía para el salón: ${salonActual}`);
    bandejaArticulos = [];       // Limpiar array
    actualizarBandejaVisual();   // Dejar contenedor vacío
    verificarBandeja();          // Ocultar botón y bandeja
    return;
  }

  // ✅ Si hay artículos, cargamos la bandeja
  bandejaArticulos = [];
  snapshot.forEach(doc => {
    const data = doc.data();
    bandejaArticulos.push({
      id: doc.id,
      articulo: data.articulo,
      unidades: data.unidades,
      cajas: data.cajas,
      rotas: data.rotas,
      salonenviar: data.salonenviar,
      notas: data.notas
    });
  });

  actualizarBandejaVisual();
  verificarBandeja();
}

//funcion para mostrar unidades de cajas
function formatearCajas(articulo, cajas) {

  cajas = parseInt(cajas) || 0;

  // Si no hay cajas, no mostrar nada
  if (cajas <= 0) {
    return "";
  }

  const articuloInfo = JSON.parse(sessionStorage.getItem("articulosCache") || "[]")
    .find(a => a.articulo?.trim().toLowerCase() === articulo.trim().toLowerCase());

  const unidadesPorCaja = parseInt(articuloInfo?.unixcajapack) || 0;

  // Si no tiene unidades por caja, mostrar sólo las cajas
  if (unidadesPorCaja <= 0) {
    return `${cajas}`;
  }

  return `
    ${cajas}
     <span class="texto-cajapack">(${unidadesPorCaja} c/u)</span>
  `;
}

      columnaActualIndex
    ];

  }

  else {

    filtrosActivos[
      columnaActualIndex
    ] = seleccionados;

  }


  aplicarFiltrosMultiples();

  actualizarIndicadoresFiltro();


  document
    .getElementById("filtroDropdown")
    .style.display = "none";
}


/**********************
 * ORDENAR TABLA POR FECHA
 **********************/

function ordenarTablaPorFecha() {

  const tbody =
    document.getElementById("tablaArticulos");

  const filas =
    Array.from(
      tbody.querySelectorAll("tr")
    );


  filas.sort((a, b) => {

    const fechaA =
      convertirFechaTabla(
        a.cells[2]?.textContent.trim() || ""
      );

    const fechaB =
      convertirFechaTabla(
        b.cells[2]?.textContent.trim() || ""
      );

    return fechaA - fechaB;

  });


  tbody.innerHTML = "";

  filas.forEach(fila =>
    tbody.appendChild(fila)
  );

}


function convertirFechaTabla(fecha) {

  const partes =
    fecha.split("/");

  if (partes.length !== 3) {

    return new Date(0);

  }


  const dia =
    partes[0].padStart(2, "0");

  const mes =
    partes[1].padStart(2, "0");

  const anio =
    partes[2];


  return new Date(
    `${anio}-${mes}-${dia}T00:00:00`
  );

}

function mostrarOpcionesFiltradas() {

  const filtroTexto =
    document
      .getElementById("filtroInput")
      .value
      .toLowerCase()
      .trim();


  const opcionesDiv =
    document.getElementById(
      "opcionesFiltro"
    );

  // =====================================================
  // VER TODOS
  // =====================================================

    document.createElement("div");

  filaTodos.innerHTML = `

  `;


  opcionesDiv.appendChild(
    filaTodos
  );


  // =====================================================
  // FILTRO ESPECIAL FECHA
  // =====================================================

  if (columnaActualIndex === 2) {

    const ahora =
      new Date();

    const anioActual =
      ahora.getFullYear();

    const mesActual =
      ahora.getMonth();


    const meses = [
      "Enero",
      "Febrero",
      "Marzo",
      "Abril",
      "Mayo",
      "Junio",
      "Julio",
      "Agosto",
      "Septiembre",
      "Octubre",
      "Noviembre",
      "Diciembre"
    ];


    // =================================================
    // TÍTULO DE SECCIÓN
    // =================================================

    function crearTituloSeccion(
      texto,
      id
    ) {

      const titulo =
        document.createElement("div");


      titulo.id =
        id;


      titulo.style.display =
        "flex";

      titulo.style.alignItems =
        "center";

      titulo.style.justifyContent =
        "space-between";

      titulo.style.cursor =
        "pointer";

      titulo.style.fontWeight =
        "bold";

      titulo.style.color =
        "#333";

      titulo.style.padding =
        "6px 4px";

      titulo.style.marginTop =
        "5px";

      titulo.style.borderTop =
        "1px solid #ddd";

      titulo.style.userSelect =
        "none";


      const textoTitulo =
        document.createElement("span");

      textoTitulo.textContent =
        texto;


      const flecha =
        document.createElement("span");

      flecha.textContent =
        "▶";

      flecha.style.color =
        "#222";

      flecha.style.fontSize =
        "12px";

      flecha.style.marginLeft =
        "10px";


      titulo.appendChild(
        textoTitulo
      );

      titulo.appendChild(
        flecha
      );


      return {
        titulo,
        flecha
      };

    }


    // =================================================
    // SECCIÓN MES
    // =================================================

    const seccionMes =
      document.createElement("div");


    const tituloMes =
      crearTituloSeccion(
        "Mes",
        "tituloFiltroMes"
      );


    const contenidoMes =
      document.createElement("div");


    contenidoMes.style.display =
      "none";

    contenidoMes.style.marginTop =
      "3px";

    contenidoMes.style.marginBottom =
      "5px";


    tituloMes.titulo.addEventListener(
      "click",
      () => {

        const cerrado =
          contenidoMes.style.display ===
          "none";


        if (cerrado) {

          contenidoMes.style.display =
            "block";

          tituloMes.flecha.textContent =
            "▼";

        }

        else {

          contenidoMes.style.display =
            "none";

          tituloMes.flecha.textContent =
            "▶";

        }

      }
    );


    // =================================================
    // MESES DEL AÑO ACTUAL
    // =================================================

    for (
      let index = mesActual;
      index >= 0;
      index--
    ) {

      const nombreMes =
        meses[index];


      const numeroMes =
        String(index + 1)
          .padStart(2, "0");


      const valorMes =
        `mes:${anioActual}-${numeroMes}`;


      const textoMes =
        `${nombreMes} ${anioActual}`;


      if (
        filtroTexto &&
        !textoMes
          .toLowerCase()
          .includes(filtroTexto)
      ) {

        continue;

      }


      const contenedorMes =
        document.createElement("div");


      const filaMes =
        document.createElement("div");


      filaMes.style.display =
        "flex";

      filaMes.style.alignItems =
        "center";


      // Checkbox del mes

      const checkboxMes =
        document.createElement("input");


      checkboxMes.type =
        "checkbox";

      checkboxMes.className =
        "form-check-input";

      checkboxMes.value =
        valorMes;

      checkboxMes.id =
        `check-${valorMes}`;


      // Label

      const labelMes =
        document.createElement("label");


      labelMes.className =
        "form-check-label";

      labelMes.htmlFor =
        checkboxMes.id;

      labelMes.textContent =
        textoMes;

      labelMes.style.marginLeft =
        "6px";


      // Botón días

      const botonMes =
        document.createElement("button");


      botonMes.type =
        "button";

      botonMes.textContent =
        "▶";

      botonMes.style.border =
        "none";

      botonMes.style.background =
        "transparent";

      botonMes.style.color =
        "#222";

      botonMes.style.padding =
        "0";

      botonMes.style.marginLeft =
        "7px";

      botonMes.style.cursor =
        "pointer";

      botonMes.style.fontSize =
        "11px";


      filaMes.appendChild(
        checkboxMes
      );

      filaMes.appendChild(
        labelMes
      );

      filaMes.appendChild(
        botonMes
      );


      contenedorMes.appendChild(
        filaMes
      );


      // =================================================
      // DÍAS
      // =================================================

      const diasDiv =
        document.createElement("div");


      diasDiv.style.display =
        "none";

      diasDiv.style.marginLeft =
        "28px";

      diasDiv.style.marginTop =
        "3px";


      const cantidadDias =
        new Date(
          anioActual,
          index + 1,
          0
        ).getDate();


      const ultimoDia =
        index === mesActual
          ? ahora.getDate()
          : cantidadDias;


      for (
        let dia = 1;
        dia <= ultimoDia;
        dia++
      ) {

        const diaTexto =
          String(dia)
            .padStart(2, "0");


        const fechaTexto =
          `${diaTexto}/${numeroMes}/${anioActual}`;


        const valorDia =
          `fecha:${fechaTexto}`;


        const filaDia =
          document.createElement("div");


        filaDia.className =
          "form-check";


        const checkboxDia =
          document.createElement("input");


        checkboxDia.type =
          "checkbox";

        checkboxDia.className =
          "form-check-input";

        checkboxDia.value =
          valorDia;

        checkboxDia.id =
          `check-${valorDia}`;


        const labelDia =
          document.createElement("label");


        labelDia.className =
          "form-check-label";

        labelDia.htmlFor =
          checkboxDia.id;

        labelDia.textContent =
          fechaTexto;


        filaDia.appendChild(
          checkboxDia
        );

        filaDia.appendChild(
          labelDia
        );


        diasDiv.appendChild(
          filaDia
        );


        // ---------------------------------------------
        // SELECCIONAR DÍA
        // ---------------------------------------------

        checkboxDia.addEventListener(
          "change",
          () => {

            if (checkboxDia.checked) {

              checkboxMes.checked =
                false;

            }


            const todos =
              document.getElementById(
                "checkTodos"
              );


            if (
              checkboxDia.checked &&
              todos?.checked
            ) {

              todos.checked =
                false;

            }

          }
        );

      }


      contenedorMes.appendChild(
        diasDiv
      );


      // =================================================
      // ABRIR / CERRAR DÍAS
      // =================================================

      botonMes.addEventListener(
        "click",
        () => {

          const cerrado =
            diasDiv.style.display ===
            "none";


          if (cerrado) {

            diasDiv.style.display =

            botonMes.textContent =
              "▼";

          }

          else {

            diasDiv.style.display =
              "none";

            botonMes.textContent =
              "▶";

          }

        }
      );


      // =================================================
      // SELECCIONAR MES
      // =================================================

      checkboxMes.addEventListener(
        "change",
        () => {

          if (checkboxMes.checked) {

            diasDiv
              .querySelectorAll(
                'input[type="checkbox"]'
              )
              .forEach(cb => {

                cb.checked =
                  false;

              });


            const todos =
              document.getElementById(
                "checkTodos"
              );


            if (todos) {

              todos.checked =
                false;

            }

          }

        }
      );


      contenidoMes.appendChild(
        contenedorMes
      );

    }


    seccionMes.appendChild(
      tituloMes.titulo
    );

    seccionMes.appendChild(
      contenidoMes
    );


    opcionesDiv.appendChild(
      seccionMes
    );


    // =================================================
    // SECCIÓN AÑO
    // =================================================

            "block";

        }

          contenidoAnio.style.display =
            "none";

          tituloAnio.flecha.textContent =

        }

      }
    );


    // =================================================
    // AÑOS
    // =================================================

    for (
      let anio = anioActual;
      anio >= anioActual - 1;
      anio--
    ) {

      const valor =
        `anio:${anio}`;


      const texto =
        String(anio);


      if (
        filtroTexto &&
        !texto.includes(
          filtroTexto
        )

        continue;

      }


      const opcion =
        document.createElement("div");

        <label
          class="form-check-label"
          for="check-${valor}"
        >
          ${texto}
        </label>
      `;


      contenidoAnio.appendChild(
        opcion
      );

    }


    seccionAnio.appendChild(
      tituloAnio.titulo
    );

    seccionAnio.appendChild(
      contenidoAnio
    );


    opcionesDiv.appendChild(
      seccionAnio
    );


    // =================================================
    // ÚLTIMOS DÍAS
    // =================================================

    const tituloUltimos =
      document.createElement("div");


    tituloUltimos.textContent =
      "Últimos 2 días";


    tituloUltimos.style.fontWeight =
      "bold";

    tituloUltimos.style.color =
      "#333";

    tituloUltimos.style.padding =
      "6px 4px";

    tituloUltimos.style.marginTop =
      "5px";

    tituloUltimos.style.borderTop =
      "1px solid #ddd";


    opcionesDiv.appendChild(
      tituloUltimos
    );


    // =================================================
    // FECHAS QUE YA ESTÁN EN LA TABLA
    // =================================================

    todasOpcionesFiltro.forEach(
      valor => {

        if (
          !valor
            .toLowerCase()
            .includes(filtroTexto)
        ) {

          return;

        }


        const opcion =
          document.createElement("div");


        opcion.className =
          "form-check";


        let valorCheckbox =
          valor;


        if (
          /^\d{2}\/\d{2}\/\d{4}$/
            .test(valor)
        ) {

          valorCheckbox =
            `fecha:${valor}`;

        }


        opcion.innerHTML = `
          <input
            class="form-check-input"
            type="checkbox"
            value="${valorCheckbox}"
            id="check-${valorCheckbox}"
          >

          <label
            class="form-check-label"
            for="check-${valorCheckbox}"
          >
            ${valor}
          </label>
        `;


        opcionesDiv.appendChild(
          opcion
        );

      }
    );

  }


  // =====================================================
  // FILTROS NORMALES
  // =====================================================

  else {

    todasOpcionesFiltro.forEach(
      valor => {

        if (
          !valor
            .toLowerCase()
            .includes(filtroTexto)
        ) {

          return;

        }


        const opcion =
          document.createElement("div");

let bandejaArticulos = [];

function guardarEnBandeja({ articulo, unidades, cajas, salonenviar, notas }) {
  const contenedor = document.getElementById("contenedorBandeja");

  const item = document.createElement("div");
  item.className = "d-flex justify-content-between align-items-start bg-light border rounded px-2 py-1";

  const contenido = `
    <div class="small">
      <strong>${articulo}</strong><br>

      ${notas ? `📝 ${notas}` : ""}
    </div>
    <button class="btn btn-sm btn-danger ms-2" onclick="this.parentElement.remove(); verificarBandeja();">x</button>
  `;

  item.innerHTML = contenido;
  contenedor.appendChild(item);

  document.getElementById("botonToggleBandeja").classList.remove("d-none");
}

function verificarBandeja() {
  const bandejaFlotante = document.getElementById("bandejaFlotante");
  const btnDesktop = document.getElementById("botonToggleBandeja");
  const btnMovil = document.getElementById("botonToggleBandejaMovil");

  const hayDatos = bandejaArticulos && bandejaArticulos.length > 0;

  // Ocultar bandeja flotante si no hay datos
  if (!hayDatos && bandejaFlotante) {
    bandejaFlotante.style.display = "none";
  }

  // Mostrar/ocultar botones (desktop y móvil)
  [btnDesktop, btnMovil].forEach(btn => {
    if (btn) {
      if (hayDatos) {
        btn.classList.remove("oculto-js");
      } else {
        btn.classList.add("oculto-js");
      }
    }
  });
}

function actualizarBandejaVisual() {
  const contenedor = document.getElementById("contenedorBandeja");
  contenedor.innerHTML = "";

  bandejaArticulos.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "bg-light border rounded p-2 shadow-sm";

    div.innerHTML = `
      <div class="fw-bold">${item.articulo}</div>
      <div class="small text-muted">
        ${item.unidades ? `Unid: ${item.unidades}` : ""} 
        ${item.cajas ? `Cajas: ${item.cajas}` : ""} 
        ${item.rotas ? `Rotas: ${item.rotas}` : ""} 
        ${item.salonenviar ? `→ ${item.salonenviar}` : ""}

      ${item.notas ? `<div class="text-muted fst-italic">${item.notas}</div>` : ""}
      <div class="text-end mt-1">
        <button class="btn btn-sm btn-outline-danger" onclick="eliminarDeBandeja(${i})">❌</button>
      </div>
    `;

    contenedor.appendChild(div);
  });

  // Animaciones solo en botón desktop
  const botonDesktop = document.getElementById("botonToggleBandeja");
  if (botonDesktop) {
    botonDesktop.classList.remove("parpadea", "bandeja-llena");
    if (bandejaArticulos.length > 0 && bandejaArticulos.length < 20) {
      botonDesktop.classList.add("parpadea");
    } else if (bandejaArticulos.length >= 20) {
      botonDesktop.classList.add("bandeja-llena");
    }
  }
}

function toggleBandeja() {

  bandeja.style.display = bandeja.style.display === "none" ? "block" : "none";
}

document.addEventListener("DOMContentLoaded", () => {
  const formulario = document.getElementById("formularioIngreso");
  const flecha = document.getElementById("proyectorFlecha");

  let abierto = false;
  let animando = false;

  // Inicializar texto y clase
  flecha.textContent = "CARGAR";
  flecha.classList.add("boton-cargar");

  function abrirFormulario() {
    if (abierto || animando) return;
    animando = true;
    formulario.classList.remove("oculto");
    formulario.classList.add("visible");
    flecha.classList.add("activa");
    setTimeout(() => {
      animando = false;
      abierto = true;
    }, 400);
  }

  function cerrarFormulario() {
    if (!abierto || animando) return;
    animando = true;
    formulario.classList.remove("visible");
    formulario.classList.add("oculto");
    flecha.classList.remove("activa");
    setTimeout(() => {
      animando = false;
      abierto = false;
    }, 400);
  }

  // Click sobre la flecha
  flecha.addEventListener("click", () => {
    if (abierto) cerrarFormulario();
    else abrirFormulario();
  });

  // Pasar el mouse sobre la flecha (hover)
  flecha.addEventListener("mouseenter", () => {
    if (abierto) cerrarFormulario();
    else abrirFormulario();
  });

  // Swipe táctil (móvil)
  let startX = 0;
  flecha.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
  });

  flecha.addEventListener("touchend", (e) => {
    const endX = e.changedTouches[0].clientX;
    const deltaX = startX - endX;
    if (Math.abs(deltaX) > 50) {
      if (abierto) cerrarFormulario();
      else abrirFormulario();
    }
  });
});

        }, 300);
      }

      ultimaPosicionScroll = posicionActual;
    });
  });
</script>
